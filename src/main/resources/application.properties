spring.application.name=SwiftAttend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/swiftattend}
spring.datasource.username=${DATABASE_USER:swiftattend}
spring.datasource.password=${DATABASE_PASSWORD:swiftattend}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-to-at-least-32-bytes}
app.jwt.minutes=${JWT_MINUTES:15}
app.refresh.days=${JWT_REFRESH_DAYS:7}
app.cookie.secure=${COOKIE_SECURE:false}
app.qr.max-age-ms=${QR_MAX_AGE_MS:2000}
app.qr.future-skew-ms=${QR_FUTURE_SKEW_MS:1000}
app.cors.origin=${CLIENT_URL:http://localhost:8080}
